[mutmut]
# L2 mutation-testing config (Wave-2.6 full-coverage program §12.2). Mutates PRODUCTION
# code experiments.py + its unit tests. mutmut 3.x runs in a mutants/ sandbox copy, so it
# must also_copy the whole src/ (else the tests' error_coupling_simulator imports
# fail). GPU-reachable mutants are out of L2 scope (§12.2, requires_cuda equivalence gate);
# --max-children 1 keeps GPU serial.
source_paths=src/error_coupling_simulator/frontend/experiments.py
pytest_add_cli_args_test_selection=tests/test_experiments_units.py
also_copy=src
