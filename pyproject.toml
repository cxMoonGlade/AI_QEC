[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-static"
version = "0.1.0"
description = "Pre-release SCOPE-Static toolbox for QEC physical-mechanism data, teacher audits, and learner/noise-generation diagnostics"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
    "stim",
    "torch",
]

[project.optional-dependencies]
cuda-extension = ["ninja"]

[project.scripts]
scope-static-toolbox = "scope_static.toolbox:main"
scope-catalog-teacher = "scope_static.experiments.qec_noise_catalog.controlled_catalog_teacher:main"
scope-data-preparation-teacher = "scope_static.experiments.qec_noise_catalog.data_preparation_teacher:main"
teacher-distinguishment = "scope_static.experiments.qec_noise_catalog.teacher_distinguishment:main"
learner-acceptance = "scope_static.experiments.qec_noise_catalog.learner_acceptance:main"
scope-stage3a-freeze = "scope_static.experiments.stage3.protocol_freeze:main"
scope-stage3a5-ceiling = "scope_static.experiments.stage3.observability_ceiling:main"
scope-stage3b0-baselines = "scope_static.experiments.stage3.baselines:main"
scope-stage3b1-discovery = "scope_static.experiments.stage3.discovery_model:main"
scope-stage3c-generator = "scope_static.experiments.stage3.generator_learning:main"
scope-stage3d1-assignment-shuffle = "scope_static.experiments.stage3.assignment_shuffle_audit:main"
scope-stage3d2-feature-scramble = "scope_static.experiments.stage3.feature_scramble_audit:main"
scope-stage3d3-context-shuffle = "scope_static.experiments.stage3.context_shuffle_audit:main"
scope-stage3d4-k-stress = "scope_static.experiments.stage3.k_stress_audit:main"
scope-stage3d4b-overcomplete-merge-prune = "scope_static.experiments.stage3.overcomplete_merge_prune_audit:main"
scope-stage4-synthetic-freeze = "scope_static.experiments.stage4.synthetic_freeze:main"
scope-stage4-source-ceiling = "scope_static.experiments.stage4.source_ceiling:main"
scope-stage4-source-pretrain = "scope_static.experiments.stage4.source_pretrain:main"
scope-stage4-support-audit = "scope_static.experiments.stage4.support_audit:main"
scope-stage4-assignment-geometry = "scope_static.experiments.stage4.assignment_geometry:main"
scope-stage4-google-transfer = "scope_static.experiments.stage4.google_transfer:main"
scope-stage4-transfer-diagnostics = "scope_static.experiments.stage4.transfer_diagnostics:main"
scope-google-s3-visible-adapter = "scope_static.experiments.willow_data.s3_visible_adapter:main"
scope-google-s3-visible-cache-v2 = "scope_static.experiments.willow_data.s3_visible_cache_v2:main"
scope-google-s3-visible-aggregate-v2 = "scope_static.experiments.willow_data.s3_visible_aggregate_v2:main"
scope-google-s3-visible-adapter-v2 = "scope_static.experiments.willow_data.s3_visible_adapter_v2:main"
scope-teacher-physicality-audit = "scope_static.experiments.qec_noise_catalog.teacher_physicality_audit:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scope_static = ["cuda/*.cpp", "cuda/*.cu", "cuda/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
