[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-twin"
version = "0.1.0"
description = "Teacher-learner, finance-structured QEC error-mechanism digital twin — the B-path calibration/intervention substrate (qec_twin is a stable code identifier; see docs/TWIN.md)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
    "stim",
    "torch",
]

[project.optional-dependencies]
cuda-extension = ["ninja"]
# M4 decoder pin (registration S1/S11): frozen evaluator-side decoder, CPU,
# upstream defaults; wheel sha256 recorded in qec_twin/hardware/m4_decode.py.
hw = ["pymatching==2.4.0"]

[project.scripts]
# Single console entry point, lands with M4 (ADR 0007 Decision 6, ratified R4).
qec-twin-m4 = "qec_twin.hardware.m4_report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qec_twin.forward" = ["kernels/*.cpp", "kernels/*.cu", "kernels/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: opt-in heavy runs (e.g. whole-corpus m2d parity; enable with QEC_TWIN_HW_SLOW)",
]
