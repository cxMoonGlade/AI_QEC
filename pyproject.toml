[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-static"
version = "0.1.0"
description = "Static SCOPE-Twin MVP foundation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
    "stim",
    "torch",
]

[project.optional-dependencies]
cuda-extension = ["ninja"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scope_static = ["cuda/*.cpp", "cuda/*.cu", "cuda/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
