[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-static"
version = "0.1.0"
description = "Pre-release SCOPE-Static toolbox for QEC physical-mechanism data, teacher audits, and learner/noise-generation diagnostics"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
    "stim",
    "torch",
]

[project.optional-dependencies]
cuda-extension = ["ninja"]

[project.scripts]
scope-static-toolbox = "scope_static.toolbox:main"
scope-layer1-prep = "scope_static.experiments.run_s2d_physical_teacher:main"
scope-layer2-teacher = "scope_static.experiments.run_phyc2_sampled_observation_separability:main"
scope-layer3-canonical = "scope_static.experiments.run_layer3_canonical_acceptance:main"
scope-stage3a-freeze = "scope_static.experiments.run_stage3a_protocol_freeze:main"
scope-stage3a5-ceiling = "scope_static.experiments.run_stage3a5_observability_ceiling:main"
scope-stage3b0-baselines = "scope_static.experiments.run_stage3b0_baselines:main"
scope-stage3b1-discovery = "scope_static.experiments.run_stage3b1_discovery_model:main"
scope-stage3c-generator = "scope_static.experiments.run_stage3c_generator_learning:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scope_static = ["cuda/*.cpp", "cuda/*.cu", "cuda/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
