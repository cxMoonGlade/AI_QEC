[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "error-coupling-simulator"
version = "0.1.0"
description = "A faithful, GPU-first simulator of QEC error mechanisms — coupling, leakage, and other non-Pauli / memory-ful noise on the rotated surface code (XZZX); emits the multi-time syndrome record. Binding spec: docs/SIMULATOR.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opt_einsum",
    "PyYAML",
    "stim",
    "torch",
]

[project.optional-dependencies]
cuda-extension = ["ninja"]
# M4 decoder pin (registration S1/S11): frozen evaluator-side decoder, CPU,
# upstream defaults; wheel sha256 recorded in qec_twin/hardware/m4_decode.py.
hw = ["pymatching==2.4.0"]
# INDEPENDENT-oracle test deps. tests/test_joint_lindbladian.py validates the joint-Lindbladian
# assembler against QuTiP + scipy (NOT the module's own code — faithfulness protocol rule I); the
# qutip_* gtchecks already use them. Declared so a bare `pytest` does not silently SKIP the oracle
# tests and "pass" with zero coverage (the skip when missing is loud — NOT a release basis).
test = ["qutip", "scipy"]

[project.scripts]
# Frozen evaluator-side R2 decoder report (routes through the still-used qec_twin.hardware decoder).
qec-twin-m4 = "qec_twin.hardware.m4_report:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"error_coupling_simulator.carrier.kernels" = ["*.cpp", "*.cu", "README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: opt-in heavy runs (e.g. whole-corpus m2d parity; enable with QEC_TWIN_HW_SLOW)",
]
