[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-twin"
version = "0.1.0"
description = "Teacher-learner, finance-structured QEC error-mechanism digital twin — the B-path calibration/intervention substrate (qec_twin is a stable code identifier; see docs/TWIN.md)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "PyYAML",
    "stim",
    "torch",
]

[project.optional-dependencies]
cuda-extension = ["ninja"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qec_twin.forward" = ["kernels/*.cpp", "kernels/*.cu", "kernels/README.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "slow: opt-in heavy runs (e.g. whole-corpus m2d parity; enable with QEC_TWIN_HW_SLOW)",
]
