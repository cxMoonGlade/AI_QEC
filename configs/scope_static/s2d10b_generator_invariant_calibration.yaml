run:
  name: s2d10b_generator_invariant_calibration
  output_root: outputs/scope_static

s2d_physical:
  backend: qiskit_aer_gpu
  require_gpu: true
  allow_cpu_aer_fallback: false

s2d10b_generator_invariant_calibration:
  source_root: outputs/scope_static/S2D.9_local_Pauli_Lindblad_observability
  output_dir: outputs/scope_static/S2D.10b_generator_invariant_calibration
  permutation_repeats: 128
  seed: 0
  eps: 1.0e-9
  runs:
    - name: phys9_setA
      purpose: regression context for generator-invariant calibration
    - name: phys9_multicircuit_setB_balanced
      purpose: balanced set_B invariant calibration target
    - name: phys9_multicircuit_setC_balanced
      purpose: balanced set_C invariant calibration target
