run:
  name: s2d_phys4_difficulty_expansion
  output_root: outputs/scope_static

s2d_physical:
  backend: qiskit_aer_gpu
  require_gpu: true
  allow_cpu_aer_fallback: false
  paper_informed_ptm_features: true
  shots: 10000
  seed: 0
  theta: 0.18
  mechanisms:
    M0:
      p_x: 0.0015
      p_y: 0.0008
      p_z: 0.0022
    M1:
      epsilon: 0.045
    M2:
      epsilon: 0.035
    M3:
      epsilon: 0.04
    M4:
      gamma: 0.018
    M5:
      p0_to_1: 0.025
      p1_to_0: 0.011
    M6:
      eta: 0.02
    M7:
      p: 0.006
    M8:
      epsilon_x: 0.024
      epsilon_y: 0.017
    M9:
      epsilon: 0.025
    M10:
      gamma: 0.012
    M11:
      p: 0.018
    M12:
      axis: rx
      epsilon_mean: 0.032
      epsilon_span: 0.018
    M13:
      eta: 0.006

s2d_difficulty_expansion:
  output_dir: outputs/scope_static/S2D_PHYS4_difficulty_expansion
  random_baseline_trials: 64
  bootstrap_replicates: 16
  runs:
    - name: phys5_setB
      profile: phys5_chain
      mechanism_set: set_B
      purpose: more mechanisms, same circuit
    - name: phys9_setA
      profile: phys9_chain
      mechanism_set: set_A
      purpose: bigger circuit, same mechanisms
    - name: phys9_setB
      profile: phys9_chain
      mechanism_set: set_B
      purpose: bigger circuit plus more mechanisms
    - name: phys9_setC
      profile: phys9_chain
      mechanism_set: set_C
      purpose: harder non-Pauli/SPAM/crosstalk mix
    - name: phys15_setB
      profile: phys15_chain
      mechanism_set: set_B
      purpose: hard profile after phys9_setB is stable
      enabled: false
