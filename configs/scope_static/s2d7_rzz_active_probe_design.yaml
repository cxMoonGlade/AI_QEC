run:
  name: s2d7_rzz_active_probe_design
  output_root: outputs/scope_static

s2d_physical:
  backend: cudaq
  require_gpu: true
  cudaq_target: nvidia
  cudaq_target_options: fp32
  paper_informed_ptm_features: true
  local_observable_response_model: born_local
  shots: 10000
  seed: 0
  theta: 0.18
  mechanisms:
    M0:
      p_x: 0.0015
      p_y: 0.0008
      p_z: 0.0022
    M1:
      epsilon: 0.045
    M2:
      epsilon: 0.035
    M3:
      epsilon: 0.04
    M4:
      gamma: 0.018
    M5:
      eta: 0.02
    M6:
      p: 0.006
    M7:
      epsilon_x: 0.024
      epsilon_y: 0.017
    M8:
      epsilon: 0.025
    M9:
      gamma: 0.012
    M10:
      axis: rx
      epsilon_mean: 0.032
      epsilon_span: 0.018
    M11:
      p_z: 0.0025
    M12:
      axis: rx
      epsilon: 0.028
    M13:
      p: 0.025
    M14:
      p: 0.011
    M15:
      p: 0.018
    M16:
      p: 0.02

s2d7_rzz_active_probe_design:
  output_dir: outputs/scope_static/S2D.7_RZZ_active_probe_design
  baseline_probe_set: base
  active_probe_set: rzz_active_minimal
  random_baseline_trials: 64
  bootstrap_replicates: 16
  runs:
    - name: phys9_setA
      profile: phys9_chain
      mechanism_set: set_A
      purpose: regression sanity profile before balanced active runs
    - name: phys9_multicircuit_setB_balanced
      profile: phys9_multicircuit_setB_balanced
      mechanism_set: set_B
      purpose: balanced set_B active-observability target
    - name: phys9_multicircuit_setC_balanced
      profile: phys9_multicircuit_setC_balanced
      mechanism_set: set_C
      purpose: balanced set_C active-observability target
