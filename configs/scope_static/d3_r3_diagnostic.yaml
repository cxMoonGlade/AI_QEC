run:
  name: d3_r3_diagnostic
  output_dir: outputs/scope_static/d3_r3_diagnostic
  device: cuda
  dtype: float64

circuit:
  family: surface_code:rotated_memory_x
  distance: 3
  rounds: 3
  noise:
    after_clifford_depolarization: 0.001
    after_reset_flip_probability: 0.001
    before_measure_flip_probability: 0.001
    before_round_data_depolarization: 0.001

graph:
  canonicalize_duplicate_masks: true
  residual_rank: 2

experiment:
  seeds: [0]
  teacher_modes: [exact_orbit, in_family_soft_residual, out_of_family_residual]
  epsilon_breaks: [0.0, 0.1, 0.3]
  shot_budgets: [128, 512]
  heldout_shots: 2048
  threshold_epsilon: 0.01
  threshold_seed_policy: mean

training:
  models: [local, dmle_qec, hard_orbit, soft_feature_orbit]
  model_options:
    dmle_qec:
      perturb_scale: 0.5
  steps: 100
  lr: 0.05
  aggregate_unique: true
  likelihood_backend: auto
  exact_likelihood_trainable: false
  dem_fault_logit_claim: false
  cptp_gksl_claim: false
  diagnostic_only_reason: "d=3 rounds=3 has larger B and is non-claim until exact trainable likelihood feasibility is validated."
