run:
  name: d3_r1_stage2c_disc15c_confirmatory
  output_dir: outputs/scope_static/STAGE2C_DISC15c_confirmatory_local_logit_probability
  device: cuda
  dtype: float64

circuit:
  family: surface_code:rotated_memory_x
  distance: 3
  rounds: 1
  noise:
    after_clifford_depolarization: 0.001
    after_reset_flip_probability: 0.001
    before_measure_flip_probability: 0.001
    before_round_data_depolarization: 0.001

graph:
  canonicalize_duplicate_masks: true
  residual_rank: 0

windows:
  enabled: false

experiment:
  seeds: [0]
  teacher_cases:
    - {mode: exact_orbit_separated, epsilon_break: 0.0}
  shot_budgets: [2048]
  heldout_shots: 4096
  threshold_epsilon: 0.01

training:
  models: [local]
  steps: 200
  lr: 0.05
  aggregate_unique: true
  likelihood_backend: cuda_extension
  likelihood_objective: global_exact
  exact_likelihood_trainable: true
  dem_fault_logit_claim: true
  cptp_gksl_claim: false

evaluation:
  global_exact_max_bits: 20

disc15c:
  local_logit_source: outputs/scope_static/STAGE2A2_DISC12_multi_env/env_alpha.json
  num_clusters: 9
  random_baseline_seed: 0
  random_baseline_trials: 32
