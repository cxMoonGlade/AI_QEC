run:
  name: layer1_user_defined_mechanisms
  output_root: outputs/scope_static

s2d_physical:
  backend: cudaq
  require_gpu: true
  cudaq_target: nvidia
  cudaq_target_options: fp32
  physical_teacher_model: full_circuit_cudaq
  full_circuit_cudaq_rzz_implementation: exp_pauli

  # User-facing maintenance knobs:
  mechanism_set: [M0, M4, M8, M24]
  mechanism_instance_counts:
    M0: 4
    M4: 4
    M8: 2
    M24: 2
  mechanisms:
    M0:
      p_x: 0.0015
      p_y: 0.0008
      p_z: 0.0022
    M4:
      gamma: 0.018
    M8:
      epsilon: 0.025
    M24:
      gamma_up: 0.010

  num_qubits: 6
  circuit_depth: 4
  probe_set: rzz_local_tomography
  shots: 1024
  seed: 0
  theta: 0.18
  balanced_min_instances_per_mechanism: 2
  multicircuit_teacher_batch: true
