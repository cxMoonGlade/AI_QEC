run:
  name: s2d8c_rzz_observability_ceiling
  output_root: outputs/scope_static

s2d_physical:
  backend: cudaq
  require_gpu: true
  cudaq_target: nvidia
  cudaq_target_options: fp32

s2d8c_rzz_observability_ceiling:
  source_root: outputs/scope_static/S2D.8_RZZ_dynamical_probe_design/S2D.8b_RZZ_echo_no_echo_probe_design
  output_dir: outputs/scope_static/S2D.8_RZZ_dynamical_probe_design/S2D.8c_RZZ_observability_ceiling_audit
  seed: 0
  permutation_repeats: 128
  runs:
    - phys9_setA
    - phys9_multicircuit_setB_balanced
    - phys9_multicircuit_setC_balanced
