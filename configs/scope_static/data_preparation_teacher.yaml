data_preparation_teacher:
  name: DataPreparation_full_circuit_cudaq_teacher
  output_dir: outputs/scope_static/DataPreparation_full_circuit_cudaq_allM_10q_depth20_g30_s10000/DataPreparation_teacher
  tolerance_mode: strict
  probability_tolerance: 1.0e-12
  random_state_count: 4
  enforce_pre_sampling_contract: true
  enforce_post_sampling_physicality: true
  teacher_config:
    backend: cudaq
    require_gpu: true
    cudaq_target: nvidia
    cudaq_target_options: fp32
    physical_teacher_model: full_circuit_cudaq
    full_circuit_cudaq_rzz_implementation: exp_pauli
    full_circuit_cudaq_noise_mode: hybrid
    full_circuit_cudaq_progress_logging: true
    full_circuit_cudaq_shot_batch_size: 10000
    num_qubits: 10
    circuit_depth: 20
    probe_set: rzz_local_tomography
    mechanism_set: allM
    balanced_min_instances_per_mechanism: 30
    multicircuit_teacher_batch: true
    shots: 10000
    seed: 0
    theta: 0.18
