run:
  name: d3_r1_s2d_phys_cudaq
  output_root: outputs/scope_static

s2d_physical:
  backend: cudaq
  require_gpu: true
  cudaq_target: nvidia
  cudaq_target_options: fp32
  paper_informed_ptm_features: true
  local_observable_response_model: born_local
  num_qubits: 5
  shots: 10000
  seed: 0
  theta: 0.18
  probe_set: base
  include_m5: true
  mechanisms:
    M0:
      p_x: 0.0015
      p_y: 0.0008
      p_z: 0.0022
    M1:
      epsilon: 0.045
    M2:
      epsilon: 0.035
    M3:
      epsilon: 0.04
    M4:
      gamma: 0.018
    M5:
      eta: 0.02
    M13:
      p: 0.025
    M14:
      p: 0.011
    M15:
      p: 0.018
    M16:
      p: 0.02
