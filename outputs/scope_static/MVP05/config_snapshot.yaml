run:
  name: d3_r1_mvp05_windowed_local_smoke
  output_dir: outputs/scope_static/MVP05
  device: cpu
  dtype: float64
  progress_every_records: 16
circuit:
  family: surface_code:rotated_memory_x
  distance: 3
  rounds: 1
  noise:
    after_clifford_depolarization: 0.001
    after_reset_flip_probability: 0.001
    before_measure_flip_probability: 0.001
    before_round_data_depolarization: 0.001
graph:
  canonicalize_duplicate_masks: true
  residual_ranks:
  - 0
  - 2
windows:
  enabled: true
  builders:
  - detector_geometry
  include_single_detectors: true
  include_detector_pairs: true
  include_radius1: false
  include_boundary_logical: false
  radius: 1.0
  max_window_bits: 2
  max_windows: 12
experiment:
  seeds:
  - 0
  teacher_cases:
  - mode: exact_orbit
    epsilon_break: 0.0
  - mode: in_family_soft_residual
    epsilon_break: 0.3
  shot_budgets:
  - 128
  - 512
  heldout_shots: 1024
  threshold_epsilon: 0.01
  threshold_seed_policy: mean
  teacher_residual_rank: 2
training:
  models:
  - hard_orbit
  - soft_feature_orbit
  model_options:
    dmle_qec:
      perturb_scale: 0.5
    soft_feature_orbit:
      beta_l2: 0.001
  steps: 10
  lr: 0.05
  aggregate_unique: true
  likelihood_backend: pytorch
  likelihood_objective: local_exact
  exact_likelihood_trainable: true
  dem_fault_logit_claim: true
  cptp_gksl_claim: false
evaluation:
  global_exact_max_bits: 20
