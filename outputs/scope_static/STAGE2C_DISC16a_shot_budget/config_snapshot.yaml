run:
  name: d3_r1_stage2d_disc16a_shot_budget
  output_dir: outputs/scope_static/STAGE2C_DISC16a_shot_budget
  device: cuda
  dtype: float64
circuit:
  family: surface_code:rotated_memory_x
  distance: 3
  rounds: 1
  noise:
    after_clifford_depolarization: 0.001
    after_reset_flip_probability: 0.001
    before_measure_flip_probability: 0.001
    before_round_data_depolarization: 0.001
graph:
  canonicalize_duplicate_masks: true
  residual_rank: 0
windows:
  enabled: false
experiment:
  seeds:
  - 0
  teacher_cases:
  - mode: exact_orbit_separated
    epsilon_break: 0.0
  shot_budgets:
  - 25000
  - 50000
  - 100000
  - 200000
  - 500000
  heldout_shots: 20000
  threshold_epsilon: 0.01
training:
  models:
  - local
  steps: 200
  lr: 0.05
  aggregate_unique: true
  likelihood_backend: cuda_extension
  likelihood_objective: global_exact
  exact_likelihood_trainable: true
  dem_fault_logit_claim: true
  cptp_gksl_claim: false
evaluation:
  global_exact_max_bits: 20
multi_env:
  teacher_seed: 0
  environment_design: default
  contrast_strength: 1.0
  train_env_ids:
  - 0
  - 1
  - 2
  - 3
disc16a:
  shot_budgets:
  - 25000
  - 50000
  - 100000
  - 200000
  - 500000
  bootstrap_replicates: 2
  heldout_shots: 20000
  local_inverse_steps: 200
  lr: 0.05
  num_clusters: 9
  random_baseline_seed: 0
  random_baseline_trials: 32
  sample_seed_base: 100000
  heldout_seed_base: 700000
