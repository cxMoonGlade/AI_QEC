run:
  name: d3_r1_mvp05_windowed_local_full
  output_dir: outputs/scope_static/MVP05_full_02
  device: cuda
  dtype: float64
  progress_every_records: 50
circuit:
  family: surface_code:rotated_memory_x
  distance: 3
  rounds: 1
  noise:
    after_clifford_depolarization: 0.001
    after_reset_flip_probability: 0.001
    before_measure_flip_probability: 0.001
    before_round_data_depolarization: 0.001
graph:
  canonicalize_duplicate_masks: true
  residual_ranks:
  - 0
  - 1
  - 2
  - 5
windows:
  enabled: true
  builders:
  - detector_geometry
  - template_motifs
  - orbits
  include_single_detectors: true
  include_detector_pairs: true
  include_radius1: true
  include_boundary_logical: true
  radius: 1.0
  max_window_bits: 8
experiment:
  seeds:
  - 0
  - 1
  - 2
  teacher_cases:
  - mode: exact_orbit
    epsilon_break: 0.0
  - mode: in_family_soft_residual
    epsilon_break: 0.1
  - mode: in_family_soft_residual
    epsilon_break: 0.3
  - mode: out_of_family_residual
    epsilon_break: 0.1
  - mode: out_of_family_residual
    epsilon_break: 0.3
  shot_budgets:
  - 128
  - 512
  - 2048
  heldout_shots: 4096
  threshold_epsilon: 0.01
  threshold_seed_policy: mean
  teacher_residual_rank: 5
training:
  models:
  - local
  - dmle_qec
  - hard_orbit
  - soft_feature_orbit
  model_options:
    dmle_qec:
      perturb_scale: 0.5
    soft_feature_orbit:
      beta_l2: 0.001
  steps: 200
  lr: 0.05
  aggregate_unique: true
  likelihood_backend: cuda_extension
  likelihood_objective: local_exact
  exact_likelihood_trainable: true
  dem_fault_logit_claim: true
  cptp_gksl_claim: false
evaluation:
  global_exact_max_bits: 20
