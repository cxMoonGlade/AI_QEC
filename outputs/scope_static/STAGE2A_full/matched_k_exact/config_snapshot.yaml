run:
  name: d3_r1_stage2a_full_matched_k_exact
  output_dir: outputs/scope_static/STAGE2A_full/matched_k_exact
  device: cuda
  dtype: float64
  progress_every_records: 20
circuit:
  family: surface_code:rotated_memory_x
  distance: 3
  rounds: 1
  noise:
    after_clifford_depolarization: 0.001
    after_reset_flip_probability: 0.001
    before_measure_flip_probability: 0.001
    before_round_data_depolarization: 0.001
windows:
  enabled: true
  builders:
  - detector_geometry
  - template_motifs
  - orbits
  include_single_detectors: true
  include_detector_pairs: true
  include_radius1: true
  include_boundary_logical: true
  radius: 1.0
  max_window_bits: 8
experiment:
  seeds:
  - 0
  - 1
  - 2
  heldout_shots: 4096
  threshold_epsilon: 0.01
  threshold_seed_policy: mean
  teacher_cases:
  - mode: exact_orbit_separated
    epsilon_break: 0.0
  shot_budgets:
  - 128
  - 512
  - 2048
training:
  steps: 200
  lr: 0.05
  aggregate_unique: true
  likelihood_backend: cuda_extension
  likelihood_objective: global_exact
  exact_likelihood_trainable: true
  dem_fault_logit_claim: true
  cptp_gksl_claim: false
  discovery:
    restarts: 4
    active_mass_threshold: 1.0
    restart_poor_ari_threshold: 0.5
    prototype_counts:
    - O
  model_options:
    dmle_qec:
      perturb_scale: 0.5
    known_soft_feature_orbit:
      beta_l2: 0.001
    disc_hard:
      assignment_entropy_weight: 0.02
    disc_soft:
      beta_l2: 0.001
      assignment_entropy_weight: 0.02
  models:
  - local
  - dmle_qec
  - known_hard_orbit
  - disc_hard
evaluation:
  global_exact_max_bits: 20
graph:
  canonicalize_duplicate_masks: true
  residual_rank: 0
