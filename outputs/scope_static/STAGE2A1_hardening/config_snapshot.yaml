run:
  name: d3_r1_stage2a1_hardening
  output_dir: outputs/scope_static/STAGE2A1_hardening
  device: cuda
  dtype: float64
  progress_every_records: 0
circuit:
  family: surface_code:rotated_memory_x
  distance: 3
  rounds: 1
  noise:
    after_clifford_depolarization: 0.001
    after_reset_flip_probability: 0.001
    before_measure_flip_probability: 0.001
    before_round_data_depolarization: 0.001
graph:
  canonicalize_duplicate_masks: true
  residual_rank: 0
windows:
  enabled: false
experiment:
  seeds:
  - 0
  - 1
  - 2
  teacher_cases:
  - mode: exact_orbit_separated
    epsilon_break: 0.0
  shot_budgets:
  - 2048
  heldout_shots: 4096
  threshold_epsilon: 0.01
  threshold_seed_policy: mean
training:
  models:
  - local
  - known_hard_orbit
  - disc_hard
  steps: 200
  lr: 0.05
  aggregate_unique: true
  likelihood_backend: cuda_extension
  likelihood_objective: global_exact
  exact_likelihood_trainable: true
  dem_fault_logit_claim: true
  cptp_gksl_claim: false
evaluation:
  global_exact_max_bits: 20
hardening:
  stage2a0_summary_path: outputs/scope_static/STAGE2A_full/stage2a0_summary.json
  disc10_metrics_path: outputs/scope_static/STAGE2A_DISC10_passive_audit/disc10_metrics.json
  restarts: 4
  validation_shots: 2048
  active_mass_threshold: 1.0
  restart_poor_ari_threshold: 0.5
  selection:
    active_deficit_penalty: 0.05
    collapse_penalty: 1.0
    max_entropy_normalized: 0.95
    diffuse_entropy_penalty: 0.02
  conditions:
  - id: A
    name: free_random_init
    assignment_mode: soft
    initializer: random
  - id: B
    name: free_local_logit_init
    assignment_mode: soft
    initializer: local_logit
    initializer_confidence: 6.0
  - id: C
    name: hard_st_random_init
    assignment_mode: straight_through
    initializer: random_balanced
    initializer_confidence: 6.0
  - id: D
    name: hard_st_local_logit_init
    assignment_mode: straight_through
    initializer: local_logit
    initializer_confidence: 6.0
  - id: E
    name: hard_st_local_logit_init_entropy_anneal
    assignment_mode: straight_through
    initializer: local_logit
    initializer_confidence: 6.0
    entropy_annealing:
      enabled: true
      start: 0.0
      end: 0.04
  - id: F
    name: hard_st_local_logit_init_entropy_balance
    assignment_mode: straight_through
    initializer: local_logit
    initializer_confidence: 6.0
    entropy_annealing:
      enabled: true
      start: 0.0
      end: 0.04
    assignment_balance_weight: 0.5
  - id: G
    name: hard_st_local_logit_init_entropy_balance_separation
    assignment_mode: straight_through
    initializer: local_logit
    initializer_confidence: 6.0
    entropy_annealing:
      enabled: true
      start: 0.0
      end: 0.04
    assignment_balance_weight: 0.5
    prototype_separation_weight: 0.05
    prototype_separation_margin: 0.35
